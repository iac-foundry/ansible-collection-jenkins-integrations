---
argument_specs:
  main:
    short_description: "vault_auth integration for jenkins."
    options:
      jenkins_integration_vault_endpoint:
        type: str
        required: true
        description: Peer endpoint/issuer/URL (caller-supplied; never discovered).
      jenkins_integration_vault_client_id:
        type: str
        default: ""
        description: Client identifier for the peer.
      jenkins_integration_vault_client_secret:
        type: str
        default: ""
        description: Caller-supplied client secret; never retrieved by this role.
