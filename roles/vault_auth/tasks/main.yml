---
# vault_auth: Configure Jenkins Vault plugin for AppRole-based authentication.
#
# Responsibilities (per design):
#   1. Validate all required inputs from caller (Vault endpoint, AppRole credentials)
#   2. Create Vault AppRole credentials in Jenkins Credentials store
#   3. Configure Jenkins Vault plugin global settings
#   4. Store role_id and secret_id securely in Jenkins credentials
#   5. Expose Vault AppRole credentials to platform layer for container_server role
#
# Constraints:
#   - Fail-fast asserts on required inputs before any changes
#   - No_log on any task handling AppRole secret_id or other secrets
#   - No cross-collection imports; assumes Jenkins is already running
#   - All configuration from caller-supplied variables (peer endpoint + AppRole creds)
#   - No discovery or retrieval of credentials (caller provides everything)

- name: Assert peer endpoint is supplied by the caller
  ansible.builtin.assert:
    that:
      - jenkins_integration_vault_endpoint | length > 0
      - jenkins_integration_vault_role_id | length > 0
      - jenkins_integration_vault_secret_id | length > 0
    fail_msg: |
      Required inputs missing for Vault AppRole integration:
        - jenkins_integration_vault_endpoint: HTTPS URL to Vault (caller-supplied; no discovery)
        - jenkins_integration_vault_role_id: AppRole role_id from Vault
        - jenkins_integration_vault_secret_id: AppRole secret_id from Vault
    success_msg: "Required inputs present (Vault endpoint + AppRole credentials)."
  no_log: false
  tags:
    - vault_auth

- name: Expose Vault AppRole credentials as facts for caller consumption
  ansible.builtin.set_fact:
    jenkins_integration_vault_role_id: "{{ jenkins_integration_vault_role_id }}"
    jenkins_integration_vault_secret_id: "{{ jenkins_integration_vault_secret_id }}"
  no_log: true
  tags:
    - vault_auth

- name: Wait for Jenkins to be ready (health check)
  ansible.builtin.uri:
    url: "{{ jenkins_integration_jenkins_url }}/api/json"
    method: GET
    status_code: 200
    validate_certs: false
    timeout: 10
  register: jenkins_health
  retries: 30
  delay: 2
  until: jenkins_health is succeeded
  tags:
    - vault_auth

# Jenkins' createCredentials endpoint is CSRF-protected: a POST without a
# valid crumb (and the matching session cookie) is rejected. The crumb is
# bound to the web session, so the crumb GET and the create POST must share
# the same cookie. Fetch the crumb first and carry its cookies_string into
# the POST. (Verified live: crumb + cookie + form-urlencoded json field ->
# 302 created; the previous raw-JSON, crumb-less POST never worked.)
- name: Fetch Jenkins CSRF crumb
  ansible.builtin.uri:
    url: "{{ jenkins_integration_jenkins_url }}/crumbIssuer/api/json"
    method: GET
    user: "{{ jenkins_integration_jenkins_admin_user }}"
    password: "{{ jenkins_integration_jenkins_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    timeout: 10
  register: jenkins_crumb
  tags:
    - vault_auth

- name: Check whether the Vault AppRole credential already exists (idempotency)
  ansible.builtin.uri:
    url: "{{ jenkins_integration_jenkins_url }}/credentials/store/system/domain/_/api/json?tree=credentials[id]"
    method: GET
    user: "{{ jenkins_integration_jenkins_admin_user }}"
    password: "{{ jenkins_integration_jenkins_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    timeout: 10
  register: jenkins_existing_creds
  tags:
    - vault_auth

- name: Create Jenkins Credentials (Vault AppRole) via Jenkins API
  vars:
    # createCredentials is a Stapler FORM endpoint: it expects a single
    # x-www-form-urlencoded field named "json" whose value is the
    # url-encoded JSON. ansible's body_format: form-urlencoded with a dict
    # did NOT encode this correctly here -- Jenkins received a mangled
    # value and threw 'JSONException: A JSONObject text must begin with {
    # at character 1 of credentials' (HTTP 500). Building the body as a raw
    # 'json=<urlencoded JSON>' string exactly reproduces the request that
    # was verified to work live (curl --data-urlencode). The credential
    # class is VaultAppRoleCredential (under .credentials.), NOT
    # VaultConfiguration (.configuration. is the plugin's GLOBAL config
    # object, not a Credentials type); constructor (scope, id, description,
    # roleId, secretId, path) verified via javap.
    _vault_cred_json: '{"credentials":{"scope":"GLOBAL","id":"vault-app-role","description":"Vault AppRole credentials for Jenkins Vault plugin","roleId":"{{ jenkins_integration_vault_role_id }}","secretId":"{{ jenkins_integration_vault_secret_id }}","path":"approle","$class":"com.datapipe.jenkins.vault.credentials.VaultAppRoleCredential"}}'
  ansible.builtin.uri:
    url: "{{ jenkins_integration_jenkins_url }}/credentials/store/system/domain/_/createCredentials"
    method: POST
    user: "{{ jenkins_integration_jenkins_admin_user }}"
    password: "{{ jenkins_integration_jenkins_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    headers:
      Jenkins-Crumb: "{{ jenkins_crumb.json.crumb }}"
      Cookie: "{{ jenkins_crumb.cookies_string }}"
      Content-Type: "application/x-www-form-urlencoded"
    body_format: raw
    body: "json={{ _vault_cred_json | urlencode }}"
    status_code: [200, 302]
  no_log: true
  register: jenkins_vault_cred_result
  changed_when: jenkins_vault_cred_result.status in [200, 302]
  when: "'vault-app-role' not in (jenkins_existing_creds.json.credentials | map(attribute='id') | list)"
  tags:
    - vault_auth

- name: Set facts for Jenkins container_server role
  ansible.builtin.set_fact:
    jenkins_server_vault_url: "{{ jenkins_integration_vault_endpoint }}"
    jenkins_server_vault_role_id: "{{ jenkins_integration_vault_role_id }}"
    jenkins_server_vault_secret_id: "{{ jenkins_integration_vault_secret_id }}"
  no_log: true
  tags:
    - vault_auth

- name: Vault auth integration convergence complete
  ansible.builtin.debug:
    msg: |
      vault_auth role complete.
      Jenkins configured with Vault AppRole authentication.
        - Vault endpoint: {{ jenkins_integration_vault_endpoint }}
        - AppRole credentials stored in Jenkins Credentials Store
        - Ready for secret retrieval from Vault
  tags:
    - vault_auth
