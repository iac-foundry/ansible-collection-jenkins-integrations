---
# This role wires jenkins to an ALREADY-EXISTING peer. It receives every endpoint and
# credential as a variable and never discovers or retrieves them (BLUEPRINTS_INTEGRATION_STANDARDS.md).
jenkins_integration_vault_endpoint: ""           # REQUIRED: Vault HTTPS URL (caller-supplied)
jenkins_integration_vault_role_id: ""            # REQUIRED: AppRole role_id from Vault
jenkins_integration_vault_secret_id: ""          # REQUIRED: AppRole secret_id from Vault

# Jenkins access for credential creation (must have admin access)
jenkins_integration_jenkins_url: "https://localhost:8443"
jenkins_integration_jenkins_admin_user: "admin"
jenkins_integration_jenkins_admin_password: ""  # REQUIRED: Jenkins admin password (caller-supplied)
